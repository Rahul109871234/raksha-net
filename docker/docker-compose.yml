# RAKSHA-NET logical topology (Day 1).  A -- GW -- {LEO1, LEO2} -- B
# Each hop is its own L2 network so impairments can be applied per link with tc netem.
# Open5GS/srsRAN: attach your existing core/gNB to the `access` network (see README).
services:
  node_a:
    container_name: node_a
    image: raksha/node:dev
    build: { context: .., dockerfile: docker/Dockerfile }
    cap_add: [NET_ADMIN]
    command: ["bash", "docker/entrypoint.sh", "A"]
    networks:
      a_gw:   { ipv4_address: 10.10.1.2 }
      access: { ipv4_address: 10.10.9.2 }
  gateway:
    container_name: gateway
    image: raksha/node:dev
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1 }
    command: ["bash", "docker/entrypoint.sh", "GW"]
    networks:
      a_gw:    { ipv4_address: 10.10.1.3 }
      gw_leo1: { ipv4_address: 10.10.2.2 }
      gw_leo2: { ipv4_address: 10.10.3.2 }
  leo1:
    container_name: leo1
    image: raksha/node:dev
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1 }
    command: ["bash", "docker/entrypoint.sh", "LEO1"]
    networks:
      gw_leo1: { ipv4_address: 10.10.2.3 }
      leo1_b:  { ipv4_address: 10.10.4.2 }
  leo2:
    container_name: leo2
    image: raksha/node:dev
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1 }
    command: ["bash", "docker/entrypoint.sh", "LEO2"]
    networks:
      gw_leo2: { ipv4_address: 10.10.3.3 }
      leo2_b:  { ipv4_address: 10.10.5.2 }
  node_b:
    container_name: node_b
    image: raksha/node:dev
    cap_add: [NET_ADMIN]
    command: ["bash", "docker/entrypoint.sh", "B"]
    networks:
      leo1_b: { ipv4_address: 10.10.4.3 }
      leo2_b: { ipv4_address: 10.10.5.3 }
  controller:
    container_name: controller
    image: raksha/node:dev
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]   # to call tc via docker exec
    command: ["python", "-m", "scripts.run_scenario", "--trials", "1"]
networks:
  a_gw:    { ipam: { config: [{ subnet: 10.10.1.0/24 }] } }
  gw_leo1: { ipam: { config: [{ subnet: 10.10.2.0/24 }] } }
  gw_leo2: { ipam: { config: [{ subnet: 10.10.3.0/24 }] } }
  leo1_b:  { ipam: { config: [{ subnet: 10.10.4.0/24 }] } }
  leo2_b:  { ipam: { config: [{ subnet: 10.10.5.0/24 }] } }
  access:  { ipam: { config: [{ subnet: 10.10.9.0/24 }] } }   # Open5GS/srsRAN attach point
